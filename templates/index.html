<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴스 클리핑</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='75' font-size='75'%3EN%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/3.2.2/toastui-editor.min.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/3.2.2/theme/toastui-editor-dark.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <script>
        window.defaultSearchKeywords = {{ default_keywords|tojson }};
    </script>
</head>

<body>
    <div class="sticky-top-wrapper">
        <header class="header">
            <div class="header-content">
                <h1>뉴스 클리핑</h1>
                <button class="theme-btn icon-button" onclick="toggleTheme()" aria-label="다크 모드로 전환" title="다크 모드로 전환" type="button">
                    <span class="button-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8Z"></path>
                        </svg>
                    </span>
                </button>
            </div>

            <div class="search-box">
                <input type="text" id="keyword" placeholder="검색어 입력 (Enter)" autocomplete="off" aria-label="뉴스 검색어 입력">
                <button id="searchBtn" aria-label="검색 실행">검색</button>
                <button id="advancedSearchToggleBtn" title="고급 검색" class="btn-icon" aria-label="고급 검색 열기">필터</button>

                <div id="recentKeywords" class="recent-keywords-dropdown"></div>

                <div id="advancedSearchPanel" class="advanced-search-dropdown">
                    <div class="advanced-search-header">고급 검색</div>
                    <div class="advanced-search-body">
                        <div class="form-group">
                            <label for="advInclude">반드시 포함할 단어 (+)</label>
                            <input type="text" id="advInclude" placeholder="예: 유튜브">
                        </div>
                        <div class="form-group">
                            <label for="advExclude">제외할 단어 (-)</label>
                            <input type="text" id="advExclude" placeholder="예: 사무처">
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="tabs-nav-wrapper">
            <div class="tabs-nav">
                <button class="tab-btn default-tab active" data-tab="homeTab" id="homeTabBtn"><span class="tab-btn-label">홈</span></button>
                <button class="tab-btn default-tab" data-tab="candidates" id="candidatesBtn"><span class="tab-btn-label">학습</span></button>
                <button class="tab-btn default-tab" data-tab="clippings" id="clippingsBtn"><span class="tab-btn-label">클리핑</span></button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="storage-notice" role="status">{{ storage_notice }}</div>

        <div class="tabs-content">
            <div id="homeTab" class="tab-pane active">
                {% include 'home.html' %}
            </div>

            <div id="searchPanelsContainer" class="tab-pane"></div>

            <div id="candidates" class="tab-pane">
                <div class="tab-content-inner">
                    <p>학습 화면을 불러오는 중...</p>
                </div>
            </div>

            <div id="clippings" class="tab-pane">
                <div class="tab-content-inner">
                    <p>클리핑 화면을 불러오는 중...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <div id="scrollControls" class="scroll-controls">
        <button id="scrollTopBtn" type="button" aria-label="맨 위로" title="맨 위로">
            <span class="button-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="m18 15-6-6-6 6"></path>
                </svg>
            </span>
        </button>
        <button id="scrollBottomBtn" type="button" aria-label="맨 아래로" title="맨 아래로">
            <span class="button-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="m6 9 6 6 6-6"></path>
                </svg>
            </span>
        </button>
    </div>

    <script src="https://uicdn.toast.com/editor/3.2.2/toastui-editor-all.min.js"></script>
    <script src="{{ url_for('static', path='js/main.js') }}"></script>
    <script src="{{ url_for('static', path='js/clipping_copy_formatter.js') }}"></script>
    <script src="{{ url_for('static', path='js/clipping_service.js') }}"></script>
</body>

</html>
