<div class="clipping-text-wrapper">
    <h2 class="clipping-header">클리핑 모음</h2>

    <p class="clipping-main">
        검색 결과에서 클리핑한 기사가 카테고리별로 정리됩니다.<br>
        작성 중인 내용은 브라우저에 임시 저장되고, 최종본 학습을 누르면 학습 이력과 백업에 반영됩니다.<br>
        텍스트를 직접 편집하거나 복사하고, 필요하면 초기화할 수 있습니다.
    </p>

    <div class="clipping-actions">
        <button id="copyTextBtn" class="btn-copy" type="button">텍스트 복사</button>
        <button id="finalizeLearningBtn" class="btn-copy" type="button">최종본 학습</button>
        <button id="clearTextBtn" class="btn-clear" type="button">비우기</button>
    </div>

    <section class="learning-status-panel" aria-labelledby="learningStatusTitle">
        <div class="learning-status-header">
            <div>
                <h3 id="learningStatusTitle">학습 상태</h3>
                <p id="learningStatusSummary">학습 데이터와 GitHub 백업 상태를 확인하는 중입니다.</p>
            </div>
            <span id="learningStatusBadge" class="learning-status-badge">확인 중</span>
        </div>

        <div class="learning-status-grid">
            <div class="learning-status-metric">
                <span>최종본</span>
                <strong id="learningSnapshotCount">-</strong>
            </div>
            <div class="learning-status-metric">
                <span>학습 기사</span>
                <strong id="learningArticleCount">-</strong>
            </div>
            <div class="learning-status-metric">
                <span>마지막 학습</span>
                <strong id="learningLatestAt">-</strong>
            </div>
            <div class="learning-status-metric">
                <span>백업 상태</span>
                <strong id="learningBackupStatus">-</strong>
            </div>
        </div>

        <div id="learningInsightList" class="learning-insight-list"></div>

        <div class="learning-status-actions">
            <button id="refreshLearningStatusBtn" class="btn-small" type="button">상태 새로고침</button>
            <button id="restoreLearningBtn" class="btn-small btn-restore-learning" type="button" hidden>GitHub 백업에서 복원</button>
        </div>
    </section>

    <details class="inline-alert-panel">
        <summary>
            <span>실시간 알림 관리</span>
            <small>감시 중인 검색어를 클리핑 작업 중 바로 확인합니다.</small>
        </summary>
        {% include 'alerts_tab.html' %}
    </details>

    <div id="editor" class="clipping-editor-container"></div>

    <div class="history-section">
        <button id="toggleHistoryBtn" class="btn-history-toggle" type="button">
            학습 이력 보기 (최근 30건)
        </button>
        <div id="historyContainer" class="history-container hidden">
            <div id="historyList" class="history-list">
                <p class="history-empty">이력을 불러오는 중...</p>
            </div>
        </div>
    </div>
</div>
