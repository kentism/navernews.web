<div class="candidate-workspace">
    <div class="candidate-header">
        <div>
            <h2>🔍 지능형 후보 수집</h2>
            <p>설정된 키워드와 맥락 점수를 바탕으로 오늘자 최신 뉴스를 정밀 분석합니다.</p>
        </div>
    </div>

    <!-- Collection Control Center -->
    <div class="candidate-control-center">
        <div class="control-card settings-card">
            <div class="card-icon">⚙️</div>
            <div class="card-content">
                <label class="control-label">수집 시점 기준</label>
                <div class="control-input-group">
                    <select id="sinceOverride" class="form-select-premium">
                        <option value="">마지막 학습 시점 이후 (권장)</option>
                        <option value="today">오늘 00시부터</option>
                        <option value="24h">최근 24시간 내</option>
                        <option value="3d">최근 3일 내</option>
                    </select>
                    <span id="currentCutoffLabel" class="status-badge-pulse">시점 확인 중...</span>
                </div>
                <p class="card-desc">설정한 시점 이후에 발행된 기사만 후보로 수집됩니다.</p>
            </div>
        </div>

        <div class="control-card keyword-card">
            <div class="card-icon">🔑</div>
            <div class="card-content">
                <label class="control-label">수집 키워드 관리</label>
                <div class="keyword-input-wrapper">
                    <input id="candidateKeywordInput" type="text" placeholder="검색어 추가..." autocomplete="off">
                    <button id="addCandidateKeywordBtn" class="btn-icon-add">+</button>
                </div>
                <div id="candidateKeywordList" class="compact-keyword-tags"></div>
            </div>
        </div>

        <div class="control-action-card">
            <button id="runCandidatesBtn" class="btn-run-intelligence">
                <span class="btn-icon">🚀</span>
                <span class="btn-text">후보 수집 시작</span>
            </button>
        </div>
    </div>

    <div id="candidateStatus" class="candidate-status-banner">
        대기 중인 후보 기사를 확인하거나 새로운 수집을 시작하세요.
    </div>

    <div id="candidateList" class="candidate-list-grid">
        <!-- Candidates rendered here -->
    </div>
</div>
