<div class="candidate-workspace">
    <div class="candidate-header">
        <div>
            <h2>오늘 클리핑 후보</h2>
            <p>아래 후보 수집 검색어를 기준으로 새 기사를 다시 검색합니다. 비슷한 기사는 제외하지 않고 비교 신호만 표시합니다.</p>
        </div>
        <button id="runCandidatesBtn" class="btn-copy" type="button">후보 수집</button>
    </div>

    <div class="candidate-keyword-manager">
        <div class="candidate-keyword-form">
            <input id="candidateKeywordInput" type="text" placeholder="후보 수집 검색어 입력" autocomplete="off">
            <button id="addCandidateKeywordBtn" class="btn-copy" type="button">추가</button>
        </div>
        <div id="candidateKeywordList" class="candidate-keyword-list"></div>
    </div>

    <div id="candidateStatus" class="candidate-status">후보 수집을 실행하거나 기존 후보를 확인하세요.</div>
    <div id="candidateList" class="candidate-list"></div>
</div>
