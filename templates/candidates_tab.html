<div class="candidate-workspace">
    <div class="candidate-header">
        <div>
            <h2>후보 수집</h2>
            <p>등록한 검색어로 새 기사를 가져오고, 최종본 학습 이력과 제외 이력을 기준으로 후보를 선별합니다.</p>
        </div>
    </div>

    <div class="candidate-control-center">
        <div class="control-card settings-card">
            <div class="card-icon">설정</div>
            <div class="card-content">
                <label class="control-label">수집 기간</label>
                <div class="control-input-group">
                    <select id="sinceOverride" class="form-select-premium">
                        <option value="">마지막 학습 시점 이후 (권장)</option>
                        <option value="today">오늘 00시부터</option>
                        <option value="24h">최근 24시간</option>
                        <option value="3d">최근 3일</option>
                    </select>
                    <span id="currentCutoffLabel" class="status-badge-pulse">시점 확인 중...</span>
                </div>
                <p class="card-desc">설정한 시점 이후 발행된 기사만 후보로 검토합니다.</p>
            </div>
        </div>

        <div class="control-card keyword-card">
            <div class="card-icon">검색</div>
            <div class="card-content">
                <label class="control-label">후보 수집 검색어</label>
                <div class="keyword-input-wrapper">
                    <input id="candidateKeywordInput" type="text" placeholder="검색어 추가..." autocomplete="off">
                    <button id="addCandidateKeywordBtn" class="btn-icon-add" type="button">+</button>
                </div>
                <div id="candidateKeywordList" class="compact-keyword-tags"></div>
            </div>
        </div>

        <div class="control-action-card">
            <button id="runCandidatesBtn" class="btn-run-intelligence" type="button">
                <span class="btn-text">후보 수집</span>
            </button>
        </div>
    </div>

    <div id="candidateStatus" class="candidate-status-banner">
        후보 수집 검색어를 추가한 뒤 수집을 실행하세요. 후보마다 점수와 판단 사유가 표시됩니다.
    </div>

    <div id="candidateList" class="candidate-list-grid"></div>
</div>
