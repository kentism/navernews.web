{% from 'icons.html' import icon %}
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 뉴스 클리핑</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v=login-1">
</head>

<body class="login-page">
    <script src="{{ url_for('static', path='js/login.js') }}?v=login-1"></script>
    <main class="login-main">
        <section class="login-panel" aria-labelledby="loginTitle">
            <header class="login-heading">
                <h1 id="loginTitle">{{ icon('newspaper') }}뉴스 클리핑</h1>
                <p>KCSC · News Clipping</p>
            </header>
            <form class="login-form" action="/login" method="POST">
                <label for="loginPassword">비밀번호</label>
                <input id="loginPassword" type="password" name="password" autocomplete="current-password"
                    maxlength="256" required autofocus{% if error %} aria-invalid="true" aria-describedby="loginError"{% endif %}>
                {% if error %}
                <p id="loginError" class="login-error" role="alert">비밀번호를 확인해주세요.</p>
                {% endif %}
                <button type="submit" class="btn btn-primary login-submit">접속하기{{ icon('chevron-right') }}</button>
            </form>
            <footer class="login-footer">사이트 문의 <a href="mailto:knh@kocsc.or.kr">knh@kocsc.or.kr</a></footer>
        </section>
    </main>
</body>

</html>
